<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Portal - Webcomics</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body{font-family:system-ui,Arial;margin:24px;background:#041627;color:#fff}
      .wrap{max-width:720px;margin:0 auto}
      label{display:block;margin-top:8px}
      input[type=text], input[type=password]{width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #234;background:#072234;color:#fff}
      input[type=file]{margin-top:8px}
      button{margin-top:12px;padding:10px 12px;border-radius:6px;background:#0b5fb8;color:#fff;border:none;cursor:pointer}
      .msg{margin-top:12px}
      .hint{font-size:13px;color:#9fc0dd}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin Portal — Webcomics</h1>
      <p class="hint">Upload new comic pages here. This page is protected by the admin password.</p>

      <label for="pass">Admin password</label>
      <input id="pass" type="password" placeholder="Admin password" />

      <label for="title">Title (optional)</label>
      <input id="title" type="text" placeholder="Page title or caption" />

      <label for="file">Image file (comic page)</label>
      <input id="file" type="file" accept="image/*" />

      <button id="btn">Upload</button>

      <div class="msg" id="msg"></div>

      <script>
        const btn = document.getElementById('btn')
        const pass = document.getElementById('pass')
        const file = document.getElementById('file')
        const title = document.getElementById('title')
        const msg = document.getElementById('msg')

        btn.addEventListener('click', async () => {
          msg.textContent = ''
          if (!file.files[0]) return msg.textContent = 'Please pick a file.'
          const fd = new FormData()
          fd.append('file', file.files[0])
          fd.append('title', title.value || '')
          try {
            const res = await fetch('/api/comics', {
              method: 'POST',
              headers: {
                'x-admin-password': pass.value || ''
              },
              body: fd
            })
            const json = await res.json()
            if (!res.ok) throw new Error(json.error || res.statusText)
            msg.style.color = 'lightgreen'
            msg.textContent = 'Uploaded: ' + (json.title || json.filename)
          } catch (e) {
            msg.style.color = 'salmon'
            msg.textContent = 'Error: ' + e.message
          }
        })
      </script>
    </div>
  </body>
</html>
