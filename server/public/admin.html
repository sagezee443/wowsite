<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Admin Portal - Webcomics</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body{font-family:system-ui,Arial;margin:24px;background:#041627;color:#fff}
      .wrap{max-width:720px;margin:0 auto}
      label{display:block;margin-top:8px}
      input[type=text], input[type=password]{width:100%;padding:8px;margin-top:4px;border-radius:6px;border:1px solid #234;background:#072234;color:#fff}
      .browse-btn{display:inline-block;margin-top:12px;padding:14px 18px;border-radius:10px;background:linear-gradient(180deg,#0b5fb8,#084b92);color:#fff;border:none;cursor:pointer;font-size:16px}
      .browse-btn:hover{filter:brightness(1.05)}
      .msg{margin-top:12px}
      .hint{font-size:13px;color:#9fc0dd}
      .uploads{margin-top:12px}
      .upload-item{padding:8px 10px;border-radius:8px;background:#031a2b;margin-top:8px}
      .progress{height:8px;background:#02293b;border-radius:6px;overflow:hidden;margin-top:8px}
      .progress > i{display:block;height:100%;background:linear-gradient(90deg,#4fc3ff,#1e90ff);width:0%}
      .hidden{display:none}
      .pw-row{display:flex;gap:8px;align-items:center}
      .pw-row input{flex:1}
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Admin Portal — Webcomics</h1>
      <p class="hint">Upload comic pages here. Files will be hosted locally on the server under <code>/comics/</code>. This page is protected by the admin password.</p>

      <div class="pw-row">
        <input id="pass" type="password" placeholder="Admin password" />
        <button id="browse" class="browse-btn">Browse files to upload</button>
      </div>

      <input id="file" class="hidden" type="file" accept="image/*" multiple />

      <div class="msg" id="msg"></div>

      <div class="uploads" id="uploads"></div>

      <script>
        const btn = document.getElementById('browse')
        const fileInput = document.getElementById('file')
        const pass = document.getElementById('pass')
        const msg = document.getElementById('msg')
        const uploads = document.getElementById('uploads')

        btn.addEventListener('click', () => fileInput.click())

        fileInput.addEventListener('change', async () => {
          const files = Array.from(fileInput.files || [])
          if (files.length === 0) return
          msg.textContent = ''
          uploads.innerHTML = ''

          for (const f of files) {
            // create UI entry
            const entry = document.createElement('div')
            entry.className = 'upload-item'
            entry.innerHTML = `<strong>${escapeHtml(f.name)}</strong>`

            const progressWrap = document.createElement('div')
            progressWrap.className = 'progress'
            const bar = document.createElement('i')
            progressWrap.appendChild(bar)
            entry.appendChild(progressWrap)

            uploads.appendChild(entry)

            try {
              await uploadFile(f, (p) => { bar.style.width = Math.round(p * 100) + '%' })
              const link = document.createElement('a')
              link.href = '#'
              link.textContent = 'View'
              link.style.marginLeft = '12px'
              // after successful upload, fetch latest comics list to find the filename returned
              // but server response is shown below from uploadFile
            } catch (err) {
              const errNode = document.createElement('div')
              errNode.style.color = 'salmon'
              errNode.textContent = 'Upload failed: ' + (err.message || err)
              entry.appendChild(errNode)
            }
          }

          // clear input so same files can be selected again
          fileInput.value = ''
        })

        async function uploadFile(file, onProgress) {
          return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest()
            const fd = new FormData()
            fd.append('file', file)
            fd.append('title', file.name)

            xhr.open('POST', '/api/comics', true)
            xhr.setRequestHeader('x-admin-password', pass.value || '')

            xhr.upload.onprogress = function (e) {
              if (!e.lengthComputable) return
              const p = e.loaded / e.total
              onProgress && onProgress(p)
            }

            xhr.onload = function () {
              if (xhr.status >= 200 && xhr.status < 300) {
                try {
                  const json = JSON.parse(xhr.responseText)
                  const okNote = document.createElement('div')
                  okNote.style.color = 'lightgreen'
                  okNote.style.marginTop = '8px'
                  okNote.textContent = 'Uploaded: ' + (json.title || json.filename)

                  // show direct link
                  const link = document.createElement('a')
                  link.href = json.filename
                  link.textContent = ' Open'
                  link.style.color = '#9fe3ff'
                  link.style.marginLeft = '10px'
                  okNote.appendChild(link)

                  // append to last upload-item
                  const items = document.getElementsByClassName('upload-item')
                  if (items.length) items[items.length - 1].appendChild(okNote)

                  resolve(json)
                } catch (e) {
                  reject(new Error('Invalid JSON from server'))
                }
              } else {
                // try to read error message
                let errMsg = xhr.statusText || 'Upload failed'
                try { const j = JSON.parse(xhr.responseText); if (j && j.error) errMsg = j.error } catch (e) {}
                reject(new Error(errMsg))
              }
            }

            xhr.onerror = function () { reject(new Error('Network error')) }

            xhr.send(fd)
          })
        }

        function escapeHtml(s){
          return s.replace(/[&<>"']/g, function(c){
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
          })
        }
      </script>
    </div>
  </body>
</html>
